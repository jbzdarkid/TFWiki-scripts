name: Tests
on:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - run: |
        sudo apt-get update
        sudo apt-get install -y libsystemd-dev
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - run: pip install -r requirements.txt
    - run: python -u wikitools/tests.py
      timeout-minutes: 5
    - run: python -u tests.py
      timeout-minutes: 5
